<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker - Suivi d'Entraînement</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Mes Séances</h1>
            <p class="subtitle">Planifiez et suivez vos entraînements</p>
        </header>

        <!-- Week Navigation (always visible) -->
        <div class="week-navigation" id="weekNavigation">
            <button class="week-nav-btn" id="prevWeek">←</button>
            <div class="week-info">
                <span class="week-label">Semaine</span>
                <span class="week-number" id="weekNumber">1</span>
            </div>
            <button class="week-nav-btn" id="nextWeek">→</button>
        </div>

        <!-- Week View -->
        <section class="week-view" id="weekView">
            <!-- Days will be generated by JavaScript -->
        </section>

        <!-- Info box about rotation -->
        <div class="rotation-info-box" id="rotationInfoBox" style="display: none;">
            <p>💡 <strong>Astuce :</strong> Utilisez l'option "Rotation" pour faire tourner automatiquement vos séances sur les semaines.</p>
        </div>

        <!-- Session Detail Modal -->
        <div class="modal" id="sessionModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalDay">Lundi</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>

                <div class="session-type-toggle" id="sessionTypeToggle">
                    <button class="toggle-btn active" data-type="workout">Séance</button>
                    <button class="toggle-btn" data-type="rest">Repos</button>
                    <button class="toggle-btn" data-type="rotation">Rotation</button>
                </div>

                <!-- VIEW MODE - Consultation -->
                <div class="view-mode" id="viewMode" style="display: none;">
                    <div class="view-session-name" id="viewSessionName"></div>

                    <div class="view-exercises-container" id="viewExercisesContainer">
                        <!-- Exercises in view mode will be displayed here -->
                    </div>
                </div>

                <!-- EDIT MODE - Modification -->
                <div class="edit-mode" id="editMode">
                    <!-- Workout Section -->
                    <div class="workout-section" id="workoutSection">
                        <div class="session-name-container">
                            <input
                                type="text"
                                id="sessionName"
                                class="session-name-input"
                                placeholder="Nom de la séance (ex: Push, Pull, Legs...)"
                            >
                        </div>

                        <div class="exercises-container" id="exercisesContainer">
                            <!-- Exercises will be added here -->
                        </div>

                        <button class="add-exercise-btn" id="addExerciseBtn">
                            <span class="plus-icon">+</span>
                            Ajouter un exercice
                        </button>
                    </div>

                        <!-- Rest Day Message -->
                    <div class="rest-section" id="restSection" style="display: none;">
                        <div class="rest-message">
                            <span class="rest-icon">🌿</span>
                            <p>Jour de repos</p>
                            <span class="rest-subtitle">Récupération et régénération</span>
                        </div>
                    </div>

                    <!-- Rotation Message -->
                    <div class="rotation-section" id="rotationSection" style="display: none;">
                        <div class="rotation-message">
                            <span class="rotation-icon">🔄</span>
                            <p>Rotation automatique</p>
                            <span class="rotation-subtitle">La séance tournera automatiquement chaque semaine</span>
                            <div class="rotation-current-session" id="rotationCurrentSession">
                                <!-- Will show current week's session -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="edit-btn" id="editBtn" style="display: none;">Modifier</button>
                    <button class="save-btn" id="saveBtn">Enregistrer</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
